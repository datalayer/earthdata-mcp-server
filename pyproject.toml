[build-system]
requires = ["hatchling~=1.21"]
build-backend = "hatchling.build"

[project]
name = "earthdata_mcp_server"
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Earthdata"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
description = "NASA Earthdata search and download over MCP, as a reactor_mcp_server extension."
dependencies = [
    "click",
    "earthaccess",
    # The MCP SDK 2 line, which reactor_mcp_server is built on.
    "mcp>=2,<3",
    "reactor_mcp_server>=1.0.4",
    "uvicorn",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx"]
lint = ["mdformat>0.7", "mdformat-gfm>=0.3.5", "ruff"]
typing = ["mypy>=0.990"]

[project.scripts]
earthdata-mcp-server = "earthdata_mcp_server.server:server"

[project.entry-points."reactor.mcp.extensions"]
# Any reactor_mcp_server host that has this package installed serves the
# toolset to a client that asks for it: /mcp?earthdata.
earthdata = "earthdata_mcp_server.extension:extension"

[project.license]
file = "LICENSE"

[project.urls]
Home = "https://github.com/datalayer/earthdata-mcp-server"

[tool.hatch.version]
path = "earthdata_mcp_server/__version__.py"

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore:There is no current event loop:DeprecationWarning",
  "module:make_current is deprecated:DeprecationWarning",
  "module:clear_current is deprecated:DeprecationWarning",
  "module:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning",
]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
show_error_context = true
show_error_codes = true
strict_equality = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pytest", "reactor", "reactor.*", "reactor_mcp_server", "reactor_mcp_server.*", "earthaccess"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C",
  "E",
  "F",
  "FBT",
  "I",
  "N",
  "Q",
  "RUF",
  "S",
  "T",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # FBT001 Boolean positional arg in function definition
  "FBT001",
  "FBT002",
  "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# S101 Use of `assert` detected
"earthdata_mcp_server/tests/*" = ["S101"]
# An example talks to whoever runs it.
"earthdata_mcp_server/examples/*" = ["T201"]
