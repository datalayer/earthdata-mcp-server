name: Lint and Type Check

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint,typing]"

      - name: Ruff
        run: ruff check earthdata_mcp_server/tests

      - name: MyPy
        run: mypy earthdata_mcp_server
